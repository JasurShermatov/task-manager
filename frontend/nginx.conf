# SAFF web — statik fayllar + /api/ ni backendga uzatish.
#
# Bu blok HTTP (80) uchun. HTTPS kerak bo'lsa ./certs ichiga sertifikat qo'yiladi —
# shunda konteyner 443 ni ham ochadi (qarang: nginx-tls.conf va 40-enable-tls.sh).
# Sertifikat bo'lmasa hech narsa buzilmaydi, sayt HTTP'da ishlayveradi.

server {
    listen 80;
    server_name _;                 # Cloudflare yoki oldidagi nginx Host'ni o'zi uzatadi

    include /etc/nginx/site-common.conf;
}
