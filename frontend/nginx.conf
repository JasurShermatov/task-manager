# SAFF web — statik fayllar + /api/ ni backendga uzatish.
# Hozircha IP bilan ishlaydi (server_name _). Domen ulanganda DEPLOY.md ga qarang.

server {
    listen 80;
    server_name _;                 # DOMEN: bu yerga "saff.uz www.saff.uz" deb yoziladi

    root /usr/share/nginx/html;
    index index.html;

    # foto/hujjat yuklash uchun (backendda ham cheklov bor)
    client_max_body_size 60m;
    client_body_timeout 120s;

    # xavfsizlik
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # nginx tirikmi (monitoring uchun)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;     # Excel eksport / katta yuklash uchun
        proxy_send_timeout 180s;
    }

    # hash'li fayllar (index-abc123.js) — uzoq keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html hech qachon keshlanmaydi — aks holda foydalanuvchida eski versiya qotib qoladi
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
