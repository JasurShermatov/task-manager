# HTTPS. Faqat ./certs ichida sertifikat bo'lsa yoqiladi (40-enable-tls.sh).
#
# Cloudflare "Origin Certificate" ham, Let's Encrypt ham bo'laveradi — fayl nomlari:
#   certs/origin.pem   (sertifikat)
#   certs/origin.key   (kalit)

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/site-common.conf;
}
